name: Publish to TestPyPI

on:
  workflow_dispatch:

jobs:
  publish-test:
    runs-on: ubuntu-latest

    environment:
      name: TestPyPI
      url: https://test.pypi.org/p/wallpaper-auto

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Package
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "Development Build (${{ github.ref_name }})"
          draft: false
          prerelease: true
          generate_release_notes: true
          make_latest: false
          files: |
            dist/*.whl
            dist/*.tar.gz
